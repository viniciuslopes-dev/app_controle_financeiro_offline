<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Controle Financeiro Offline</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <h1>Controle Financeiro (Offline)</h1>
      <p>Sem login • dados locais • instalável</p>
    </header>

    <main>
      <section class="card">
        <h2>Novo lançamento</h2>
        <form id="tx-form">
          <label>
            Tipo
            <select id="type" required>
              <option value="income">Receita</option>
              <option value="expense">Despesa</option>
              <option value="investment">Investimento</option>
              <option value="goal">Meta</option>
            </select>
          </label>

          <label>
            Descrição
            <input id="description" required maxlength="120" placeholder="Ex.: Mercado" />
          </label>

          <label>
            Valor
            <input id="amount" type="number" min="0" step="0.01" required placeholder="0,00" />
          </label>

          <label>
            Data
            <input id="date" type="date" required />
          </label>

          <button type="submit">Salvar</button>
        </form>
      </section>

      <section class="card">
        <h2>Resumo</h2>
        <div id="summary" class="summary-grid"></div>
      </section>

      <section class="card">
        <h2>Lançamentos</h2>
        <ul id="tx-list"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
